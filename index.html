<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오늘의 일본어 단어 암기장</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f4ee;
            --card-bg: #fcfbfa;
            --text-main: #33302e;
            --text-sub: #7a7571;
            --accent-color: #8c7355;
            --border-color: #e8e3d9;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            --hide-bg: #efece6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 8px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--accent-color);
            letter-spacing: 2px;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .header-title {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text-main);
        }

        .header-date-sub {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 14px;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: var(--accent-color);
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .controls-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            width: 100%;
        }

        .control-label {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-main);
            user-select: none;
        }

        .checkbox-group input {
            cursor: pointer;
            width: 15px;
            height: 15px;
            accent-color: var(--accent-color);
        }

        .main-card {
            background-color: var(--card-bg);
            width: 100%;
            border-radius: 16px;
            padding: 14px 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            min-height: 360px;
            margin-bottom: 14px;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* 스마트폰 화면에서도 한 줄 강제 유지 레이아웃 */
        .word-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
        }

        .word-item:last-child {
            border-bottom: none;
        }

        .word-index {
            width: 24px;
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 500;
            text-align: center;
            flex-shrink: 0;
        }

        .cell {
            padding: 2px 4px;
            border-radius: 4px;
            transition: background-color 0.2s ease, color 0.2s ease;
            white-space: nowrap; /* 줄바꿈 절대 안 됨 (한 줄 유지) */
            overflow: hidden;
            text-overflow: ellipsis; /* 너무 길면 ... 으로 표시 */
        }

        .cell.meaning {
            flex: 1.2;
            font-size: 14px;
            font-weight: 500;
            color: #2b2826;
        }

        .cell.japanese {
            flex: 1.3;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Noto Sans JP', sans-serif;
            color: #1a1918;
        }

        .cell.reading {
            flex: 1.5;
            font-size: 16px;
            color: #55504c;
            font-family: 'Noto Sans JP', sans-serif;
        }

        .cell.hidden-cell {
            background-color: var(--hide-bg);
            color: transparent !important;
            user-select: none;
            cursor: pointer;
            position: relative;
            min-height: 24px;
        }

        .cell.hidden-cell::after {
            content: "보기";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: var(--text-sub);
            opacity: 0.6;
        }

        .cell.hidden-cell.revealed {
            background-color: transparent;
            color: inherit !important;
        }

        .cell.hidden-cell.revealed::after {
            display: none;
        }

        .date-history-nav {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap; /* 날짜 버튼 한 줄 유지 */
            width: 100%;
        }

        .date-tab {
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            background-color: transparent;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .date-tab.active {
            color: #ffffff;
            font-weight: 600;
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-sub);
        }

        .loading {
            text-align: center;
            padding: 40px 0;
            color: var(--text-sub);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-subtitle">오 늘 의 &nbsp; 단 어</div>
        <div class="header-title" id="display-date-title">8월 8일</div>
        <div class="header-date-sub" id="display-date-sub">2026년 토요일</div>
        <div class="divider"></div>

        <div class="controls-card">
            <span class="control-label">가리기:</span>
            <label class="checkbox-group">
                <input type="checkbox" id="hide-meaning" onchange="updateMasking()">
                의미
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="hide-japanese" onchange="updateMasking()">
                일본어
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="hide-reading" onchange="updateMasking()">
                읽기
            </label>
        </div>

        <div class="main-card">
            <div id="word-container" class="word-list">
                <div class="loading">단어를 불러오는 중입니다...</div>
            </div>
        </div>

        <div class="date-history-nav" id="past-days-nav"></div>
    </div>

    <div class="footer-note">JAPANESE VOCABULARY MEMORY MEMO</div>

    <script>
        const SHEET_ID = '12tbJhjBVppvsOQ86nZPTuXVQ2Xu82qnj-BqvRXxFV00';

        let allWords = [];
        let currentOffset = 0;

        const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

        window.google = window.google || {};
        window.google.visualization = window.google.visualization || {};
        window.google.visualization.Query = {
            setResponse: function(response) {
                if (response && response.table && response.table.rows) {
                    allWords = parseGvizRows(response.table.rows);
                    renderDayWords(currentOffset);
                } else {
                    showError("시트 데이터 로드 실패");
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            renderPastDaysNav();
            loadSheetDataViaScript();
        });

        function loadSheetDataViaScript() {
            const script = document.createElement('script');
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:google.visualization.Query.setResponse`;
            document.body.appendChild(script);
        }

        function showError(msg) {
            document.getElementById('word-container').innerHTML = `<div class="loading">${msg}</div>`;
        }

        function parseGvizRows(rows) {
            const data = [];

            rows.forEach(row => {
                const cells = row.c;
                if (!cells) return;

                const colB = cells[1] ? (cells[1].v || '') : ''; 
                const colC = cells[2] ? (cells[2].v || '') : ''; 
                const colD = cells[3] ? (cells[3].v || '') : ''; 
                const colE = cells[4] ? (cells[4].v || '') : ''; 

                const readingCombo = [colD, colE].filter(Boolean).join(' / ');

                if (colB || colC || readingCombo) {
                    data.push({
                        meaning: String(colB),
                        japanese: String(colC),
                        reading: String(readingCombo)
                    });
                }
            });

            if (data.length > 0 && (data[0].meaning.includes("의미") || data[0].meaning.includes("한글"))) {
                data.shift();
            }

            return data;
        }

        function getDayIndexForDate(targetDate) {
            const startDate = new Date(2026, 7, 1);
            const diffTime = targetDate - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return Math.max(0, diffDays);
        }

        function renderDayWords(offset) {
            currentOffset = offset;

            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + offset);

            const month = targetDate.getMonth() + 1;
            const date = targetDate.getDate();
            const year = targetDate.getFullYear();
            const dayOfWeek = dayNames[targetDate.getDay()];

            document.getElementById('display-date-title').innerText = `${month}월 ${date}일`;
            document.getElementById('display-date-sub').innerText = `${year}년 ${dayOfWeek}`;

            renderPastDaysNav();

            const dayIdx = getDayIndexForDate(targetDate);
            const startIndex = dayIdx * 10;
            const dayWords = allWords.slice(startIndex, startIndex + 10);

            const container = document.getElementById('word-container');

            if (dayWords.length === 0) {
                container.innerHTML = `<div class="loading">등록된 단어가 없습니다.</div>`;
                return;
            }

            let html = '';
            dayWords.forEach((word, idx) => {
                html += `
                    <div class="word-item">
                        <div class="word-index">${idx + 1}</div>
                        <div class="cell meaning" onclick="toggleSingleCell(this)">${escapeHtml(word.meaning)}</div>
                        <div class="cell japanese" onclick="toggleSingleCell(this)">${escapeHtml(word.japanese)}</div>
                        <div class="cell reading" onclick="toggleSingleCell(this)">${escapeHtml(word.reading)}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateMasking();
        }

        function updateMasking() {
            const hideMeaning = document.getElementById('hide-meaning').checked;
            const hideJapanese = document.getElementById('hide-japanese').checked;
            const hideReading = document.getElementById('hide-reading').checked;

            const rows = document.querySelectorAll('.word-item');
            rows.forEach(row => {
                setCellMask(row.querySelector('.meaning'), hideMeaning);
                setCellMask(row.querySelector('.japanese'), hideJapanese);
                setCellMask(row.querySelector('.reading'), hideReading);
            });
        }

        function setCellMask(cell, shouldHide) {
            if (!cell) return;
            cell.classList.remove('revealed');
            if (shouldHide) {
                cell.classList.add('hidden-cell');
            } else {
                cell.classList.remove('hidden-cell');
            }
        }

        function toggleSingleCell(cell) {
            if (cell.classList.contains('hidden-cell')) {
                cell.classList.toggle('revealed');
            }
        }

        function loadDateOffset(offset) {
            renderDayWords(offset);
        }

        function renderPastDaysNav() {
            const nav = document.getElementById('past-days-nav');
            let html = '';

            for (let i = 3; i >= 1; i--) {
                const pastDate = new Date();
                pastDate.setDate(pastDate.getDate() - i);
                const month = pastDate.getMonth() + 1;
                const date = pastDate.getDate();
                const offset = -i;
                const isActive = (currentOffset === offset) ? 'active' : '';

                html += `<button class="date-tab ${isActive}" onclick="loadDateOffset(${offset})">${month}월 ${date}일</button>`;
            }

            const isTodayActive = (currentOffset === 0) ? 'active' : '';
            html += `<button class="date-tab ${isTodayActive}" onclick="loadDateOffset(0)">오늘</button>`;

            nav.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
